
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TKX EXTREME BALANCER 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#071c30;font-family:Arial,sans-serif;touch-action:none;user-select:none}
canvas{display:block}
#hud{position:absolute;top:12px;left:0;width:100%;padding:0 12px;display:flex;justify-content:space-between;pointer-events:none;color:white;z-index:3}
.box{background:#071827dd;border:1px solid #ffffff35;border-radius:13px;padding:9px 13px;box-shadow:0 4px 15px #0005}
.label{font-size:10px;letter-spacing:2px;color:#9dc5d6}
.value{font-size:19px;font-weight:900;margin-top:4px}
#hearts{color:#ff5c72;letter-spacing:2px}
#controls{position:absolute;bottom:20px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 19px;z-index:4}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:7px}
.ctrl{border:1px solid #ffffff80;border-radius:15px;background:#102d43cc;color:white;font-size:25px;font-weight:bold;backdrop-filter:blur(5px);touch-action:none;box-shadow:0 5px 12px #0006}
.ctrl:active{background:#17a98c}
#up{grid-column:2;grid-row:1}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#help{align-self:end;color:white;font-size:10px;text-align:center;line-height:1.6;background:#071827aa;padding:9px;border-radius:12px}
#overlay{position:absolute;inset:0;background:linear-gradient(145deg,#041421eF,#0b3044eF);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}
#card{width:min(410px,100%);background:#102b3deF;border:1px solid #ffffff35;border-radius:25px;padding:27px 22px;text-align:center;color:white;box-shadow:0 20px 60px #0009}
.logo{color:#49e3bd;letter-spacing:5px;font-weight:900;font-size:12px}
h1{font-size:32px;line-height:1.1;font-style:italic;margin:15px 0}
#description{font-size:14px;line-height:1.8;color:#c4d6df;margin:16px 0 22px}
#play{width:100%;border:0;border-radius:13px;padding:16px;background:linear-gradient(90deg,#20d5a2,#0a9fc1);font-size:17px;font-weight:900;color:#06221e}
#sub{font-size:10px;color:#91aebb;margin-top:15px;letter-spacing:2px}
.hidden{display:none!important}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
  <div class="box">
    <div class="label">LEVEL</div>
    <div class="value" id="level">01</div>
  </div>
  <div class="box" style="text-align:center">
    <div class="label">LIVES</div>
    <div class="value" id="hearts">❤️❤️❤️❤️❤️</div>
  </div>
  <div class="box" style="text-align:right">
    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>
</div>

<div id="controls">
  <div class="pad">
    <button class="ctrl" id="up">▲</button>
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="down">▼</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div id="help">गेंद को रास्ते पर रखो<br>और बाधाओं से बचो</div>
</div>

<div id="overlay">
  <div id="card">
    <div class="logo">TKX GAMES PRESENTS</div>
    <h1 id="heading">EXTREME<br>BALANCER 3D</h1>
    <div id="description">
      समुद्र के ऊपर बने लकड़ी के पुल पर गेंद को संभालकर चलाओ।<br><br>
      ▲ आगे &nbsp; ▼ पीछे<br>
      ◀ बाएँ &nbsp; ▶ दाएँ<br><br>
      रास्ते से गिरने और घूमती बाधाओं से बचो!
    </div>
    <button id="play">START GAME</button>
    <div id="sub">3D BALANCE CHALLENGE • TKX</div>
  </div>
</div>

<script>
(() => {
"use strict";

if(!window.THREE){
  document.getElementById("description").innerText =
  "3D लाइब्रेरी लोड नहीं हुई। इंटरनेट चालू करके पेज दोबारा खोलें।";
  return;
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x7cc6e7);
scene.fog=new THREE.Fog(0x7cc6e7,35,100);

const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
camera.position.set(0,6,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8edff,0x52604d,1.25));

const sun=new THREE.DirectionalLight(0xffedca,1.35);
sun.position.set(-8,20,12);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const waterGeo=new THREE.PlaneGeometry(300,300,40,40);
const waterMat=new THREE.MeshStandardMaterial({
 color:0x087caa,roughness:.22,metalness:.3
});
const water=new THREE.Mesh(waterGeo,waterMat);
water.rotation.x=-Math.PI/2;
water.position.y=-5;
scene.add(water);

// समुद्र की सजावटी लहरें
const waveMat=new THREE.MeshStandardMaterial({
 color:0x65d5ec,transparent:true,opacity:.24
});
for(let i=0;i<65;i++){
 const wave=new THREE.Mesh(new THREE.BoxGeometry(
  Math.random()*2+.5,.025,.08),waveMat);
 wave.position.set((Math.random()-.5)*100,-4.93,
 (Math.random()-.5)*100);
 scene.add(wave);
}

// लकड़ी की सामग्री
const wood=new THREE.MeshStandardMaterial({
 color:0x986039,roughness:.85
});
const woodLight=new THREE.MeshStandardMaterial({
 color:0xc28b52,roughness:.8
});
const metal=new THREE.MeshStandardMaterial({
 color:0xbccbd2,metalness:.85,roughness:.2
});
const gold=new THREE.MeshStandardMaterial({
 color:0xffc64c,metalness:.55,roughness:.25
});

const ballRadius=.55;
const ballGeo=new THREE.SphereGeometry(ballRadius,32,32);
const ballMat=new THREE.MeshStandardMaterial({
 color:0xb9783c,roughness:.42,metalness:.15
});
const ball=new THREE.Mesh(ballGeo,ballMat);
ball.castShadow=true;
scene.add(ball);

// गेंद पर लकड़ी जैसी धारियाँ
const stripeMat=new THREE.MeshStandardMaterial({color:0x74401f});
for(let i=0;i<5;i++){
 const ring=new THREE.Mesh(
  new THREE.TorusGeometry(ballRadius+.004,.012,6,40),stripeMat);
 ring.rotation.x=Math.PI/2;
 ring.rotation.y=i*.4;
 ball.add(ring);
}

const platforms=[];
const obstacles=[];
let finishMesh=null;
let checkpoint=null;
let level=1;
let lives=5;
let score=0;
let playing=false;
let finished=false;
let falling=false;
let velocity=new THREE.Vector3();
const keys={up:false,down:false,left:false,right:false};
const startPosition=new THREE.Vector3(0,ballRadius+.12,1);
let lastCheckpoint=startPosition.clone();

function platform(x,z,w,d){
 const h=.38;
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wood);
 mesh.position.set(x,-.19,z);
 mesh.receiveShadow=true;
 mesh.castShadow=true;
 scene.add(mesh);
 platforms.push({
  mesh,x,z,w,d,top:.02
 });

 // लकड़ी के तख्ते
 const count=Math.max(2,Math.floor(d/1.4));
 for(let i=0;i<count;i++){
  const line=new THREE.Mesh(
   new THREE.BoxGeometry(w,.025,.035),woodLight);
  line.position.set(x,.015,z-d/2+(i+.5)*d/count);
  scene.add(line);
 }
 // पुल के किनारों की सजावट
 for(let side of [-1,1]){
  const rail=new THREE.Mesh(
   new THREE.BoxGeometry(.09,.16,d),woodLight);
  rail.position.set(x+side*(w/2-.04),.12,z);
  scene.add(rail);
 }
 return mesh;
}

function blade(x,z){
 const group=new THREE.Group();
 group.position.set(x,.35,z);

 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(.28,.35,.22,16),metal);
 group.add(base);

 const arm=new THREE.Mesh(
  new THREE.BoxGeometry(3.2,.16,.24),metal);
 arm.castShadow=true;
 group.add(arm);

 const arm2=new THREE.Mesh(
  new THREE.BoxGeometry(.24,.16,3.2),metal);
 arm2.castShadow=true;
 group.add(arm2);

 const center=new THREE.Mesh(
  new THREE.SphereGeometry(.3,16,16),gold);
 group.add(center);

 scene.add(group);
 obstacles.push({mesh:group,x,z,phase:Math.random()*6});
}

function buildLevel(n){
 platforms.length=0;
 obstacles.length=0;
 scene.children.filter(o=>o.userData.levelObject).forEach(o=>scene.remove(o));
 if(finishMesh)scene.remove(finishMesh);
 if(checkpoint)scene.remove(checkpoint);

 // हर लेवल में रास्ते की बनावट बदलती है
 const narrow=Math.max(2.5,3.8-(n-1)*.25);
 const turn=2.5+(n-1)*.3;

 platform(0,-5,narrow,16);
 platform(turn,-15,8,3.5);
 platform(turn*2,-25,narrow,16);
 platform(turn,-35,8,3.5);
 platform(0,-45,narrow,16);
 platform(-turn,-55,8,3.5);
 platform(-turn*2,-65,narrow,16);

 // अतिरिक्त चौड़ा फिनिश प्लेटफॉर्म
 const finish=new THREE.Mesh(
  new THREE.BoxGeometry(6,.5,5),
  new THREE.MeshStandardMaterial({color:0x20b879,roughness:.45})
 );
 finish.position.set(-turn*2,.05,-75);
 finish.receiveShadow=true;
 finish.castShadow=true;
 scene.add(finish);
 finishMesh=finish;
 platforms.push({
  mesh:finish,x:-turn*2,z:-75,w:6,d:5,top:.3,isFinish:true
 });

 // घूमने वाली बाधाएँ
 blade(0,-7);
 blade(turn*2,-25);
 blade(-turn*2,-65);

 // चेकपॉइंट
 checkpoint=new THREE.Group();
 checkpoint.position.set(turn,-34,.3);
 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.06,.06,2,10),gold);
 pole.position.y=1;
 checkpoint.add(pole);
 const flag=new THREE.Mesh(
  new THREE.BoxGeometry(1.3,.7,.06),
  new THREE.MeshStandardMaterial({color:0x22e5a5,side:THREE.DoubleSide})
 );
 flag.position.set(.55,1.5,0);
 checkpoint.add(flag);
 scene.add(checkpoint);

 document.getElementById("level").textContent=String(n).padStart(2,"0");
}

function respawn(){
 ball.position.copy(lastCheckpoint);
 ball.rotation.set(0,0,0);
 velocity.set(0,0,0);
 falling=false;
}

function updateLives(){
 document.getElementById("hearts").textContent=
 "❤️".repeat(lives)+"🖤".repeat(5-lives);
}

function showScreen(title,text,button){
 playing=false;
 document.getElementById("heading").innerHTML=title;
 document.getElementById("description").innerHTML=text;
 document.getElementById("play").textContent=button;
 document.getElementById("overlay").classList.remove("hidden");
}

function startGame(){
 level=1;
 lives=5;
 score=0;
 lastCheckpoint=startPosition.clone();
 buildLevel(level);
 respawn();
 updateLives();
 document.getElementById("score").textContent="0";
 document.getElementById("overlay").classList.add("hidden");
 playing=true;
 finished=false;
}

function loseLife(){
 if(falling||!playing)return;
 falling=true;
 lives--;
 updateLives();
 if(lives<=0){
  showScreen("GAME<br>OVER",
  "तुम्हारा स्कोर: <b>"+score+"</b><br>फिर से कोशिश करो!",
  "PLAY AGAIN");
 }else{
  setTimeout(()=>{
   if(playing)respawn();
  },350);
 }
}

function nextLevel(){
 if(finished)return;
 finished=true;
 score+=500;
 if(level>=5){
  showScreen("YOU<br>ARE THE CHAMPION!",
  "शानदार! तुमने सभी 5 लेवल पूरे कर लिए।<br>अंतिम स्कोर: <b>"+score+"</b>",
  "PLAY AGAIN");
 }else{
  showScreen("LEVEL<br>COMPLETE!",
  "बहुत बढ़िया! अगला रास्ता और कठिन होगा।<br>स्कोर: <b>"+score+"</b>",
  "NEXT LEVEL");
  document.getElementById("play").onclick=()=>{
   level++;
   lives=Math.max(3,lives);
   lastCheckpoint=startPosition.clone();
   buildLevel(level);
   respawn();
   updateLives();
   document.getElementById("overlay").classList.add("hidden");
   playing=true;
   finished=false;
   document.getElementById("play").onclick=startGame;
  };
 }
}

document.getElementById("play").addEventListener("click",startGame);

function bind(id,key){
 const el=document.getElementById(id);
 const down=e=>{e.preventDefault();keys[key]=true;};
 const up=e=>{e.preventDefault();keys[key]=false;};
 el.addEventListener("pointerdown",down);
 el.addEventListener("pointerup",up);
 el.addEventListener("pointercancel",up);
 el.addEventListener("pointerleave",up);
}
bind("up","up");
bind("down","down");
bind("left","left");
bind("right","right");

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=true;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=true;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowUp"||e.key==="w")keys.up=false;
 if(e.key==="ArrowDown"||e.key==="s")keys.down=false;
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function onPlatform(x,z){
 for(const p of platforms){
  if(x>=p.x-p.w/2+.05&&x<=p.x+p.w/2-.05&&
     z>=p.z-p.d/2+.05&&z<=p.z+p.d/2-.05){
    return p;
  }
 }
 return null;
}

function update(dt){
 if(!playing)return;

 const accel=.020;
 const maxSpeed=.19;

 if(keys.up)velocity.z-=accel;
 if(keys.down)velocity.z+=accel;
 if(keys.left)velocity.x-=accel;
 if(keys.right)velocity.x+=accel;

 velocity.x*=.965;
 velocity.z*=.965;

 const horizontalSpeed=Math.sqrt(velocity.x**2+velocity.z**2);
 if(horizontalSpeed>maxSpeed){
  velocity.x=velocity.x/horizontalSpeed*maxSpeed;
  velocity.z=velocity.z/horizontalSpeed*maxSpeed;
 }

 ball.position.x+=velocity.x*(dt*60);
 ball.position.z+=velocity.z*(dt*60);

 const p=onPlatform(ball.position.x,ball.position.z);

 if(p&&!falling){
  ball.position.y=p.top+ballRadius;
  velocity.y=0;
  ball.rotation.x+=velocity.z*1.5;
  ball.rotation.z-=velocity.x*1.5;

  if(p.isFinish&&ball.position.z<-72){
   nextLevel();
   return;
  }
 }else{
  velocity.y-=.012*(dt*60);
  ball.position.y+=velocity.y*(dt*60);
 }

 // चेकपॉइंट
 if(ball.position.z<-32&&ball.position.z>-37&&
    ball.position.x>1&&ball.position.x<4){
  lastCheckpoint.set(2.5,ballRadius+.32,-34);
 }

 // बाधाओं की टक्कर
 for(const o of obstacles){
  const dx=ball.position.x-o.x;
  const dz=ball.position.z-o.z;
  if(Math.sqrt(dx*dx+dz*dz)<1.35&&
     Math.abs(ball.position.y-.9)<1.1){
   loseLife();
   break;
  }
 }

 // पुल से नीचे गिरना
 if(ball.position.y<-3.7)loseLife();

 score=Math.max(score,Math.floor(Math.max(0,-ball.position.z)*2));
 document.getElementById("score").textContent=score;
}

const cameraTarget=new THREE.Vector3();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.035);

 // पानी की हल्की गति
 water.position.y=-5+Math.sin(performance.now()*.0005)*.035;

 obstacles.forEach((o,i)=>{
  o.mesh.rotation.y+=dt*(i%2?2.8:-2.3);
 });

 update(dt);

 cameraTarget.set(
  ball.position.x*.65,
  ball.position.y+5.2,
  ball.position.z+8.5
 );
 camera.position.lerp(cameraTarget,.085);
 camera.lookAt(ball.position.x,ball.position.y,ball.position.z-2.3);

 renderer.render(scene,camera);
}

const clock=new THREE.Clock();
buildLevel(1);
respawn();
updateLives();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

animate();
})();
</script>
</body>
</html>
