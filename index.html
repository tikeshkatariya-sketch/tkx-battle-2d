
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10251c">
<title>TKX BATTLE 2D V2</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#10251c;color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;
}
canvas{display:block;width:100vw;height:100dvh}
#hud{
 position:fixed;top:9px;left:9px;right:9px;
 display:flex;justify-content:space-between;
 gap:6px;z-index:2;pointer-events:none;
}
.box{
 background:#10251ee8;border:1px solid #65d99c;
 padding:8px 10px;border-radius:10px;
 font-size:12px;
}
#bar{width:95px;height:8px;background:#555;
 border-radius:8px;margin-top:5px;overflow:hidden}
#hp{width:100%;height:100%;background:#48e58b}
#controls{position:fixed;inset:0;pointer-events:none;z-index:3}
#joystick{
 position:absolute;bottom:25px;left:22px;
 width:112px;height:112px;border-radius:50%;
 background:#ffffff25;border:2px solid #ffffff80;
 pointer-events:auto;touch-action:none;
}
#knob{
 position:absolute;width:45px;height:45px;
 left:31px;top:31px;border-radius:50%;
 background:#69e7a5;border:3px solid white;
}
#fire{
 position:absolute;right:25px;bottom:37px;
 width:85px;height:85px;border-radius:50%;
 background:#e34e54;color:white;
 border:3px solid white;font-size:15px;
 font-weight:bold;pointer-events:auto;
}
#weapons{
 position:absolute;right:15px;bottom:135px;
 display:flex;flex-direction:column;gap:7px;
 pointer-events:auto;
}
.weapon{
 padding:9px 11px;border-radius:9px;
 background:#152c25;color:white;
 border:1px solid #7cba99;font-size:11px;
}
.weapon.active{background:#62d99a;color:#10251c}
#menu{
 position:fixed;inset:0;background:#06120feF;
 display:flex;align-items:center;justify-content:center;
 z-index:5;padding:15px;
}
#card{
 width:min(360px,100%);
 max-height:95dvh;overflow:auto;
 background:#183c2c;border:2px solid #6be9a7;
 border-radius:18px;padding:23px;text-align:center;
}
h1{font-size:27px;color:#71efad;margin-bottom:5px}
.sub{color:#b5d9c5;font-size:12px;margin-bottom:16px}
label{display:block;text-align:left;margin:12px 0 5px;font-size:13px}
select{
 width:100%;padding:12px;border-radius:9px;
 background:#10251c;color:white;
 border:1px solid #73c99c;font-size:15px;
}
#start{
 width:100%;padding:14px;margin-top:18px;
 background:#6be9a7;border:0;border-radius:10px;
 font-weight:bold;font-size:17px;color:#10251c;
}
#help{font-size:12px;line-height:1.7;color:#d4e9dc;margin-top:14px}
#notice{
 position:fixed;top:65px;left:50%;
 transform:translateX(-50%);
 background:#10251eea;padding:8px 14px;
 border-radius:10px;font-size:12px;
 z-index:4;pointer-events:none;
}
@media(min-width:700px){
 #joystick{width:130px;height:130px}
 #knob{left:39px;top:39px}
}
</style>
</head>

<body>

<div id="hud">
 <div class="box">
  ❤️ HEALTH
  <div id="bar"><div id="hp"></div></div>
 </div>
 <div class="box">⭐ SCORE: <span id="score">0</span></div>
 <div class="box">👾 ENEMIES: <span id="count">0</span></div>
 <div class="box">🏆 <span id="level">EASY</span></div>
</div>

<canvas id="game"></canvas>

<div id="notice">TKX BATTLE 2D</div>

<div id="controls">
 <div id="joystick"><div id="knob"></div></div>

 <div id="weapons">
  <button class="weapon active" data-weapon="pulse">🔵 PULSE</button>
  <button class="weapon" data-weapon="rapid">🟡 RAPID</button>
  <button class="weapon" data-weapon="heavy">🟣 HEAVY</button>
 </div>

 <button id="fire">FIRE 🔥</button>
</div>

<div id="menu">
 <div id="card">
  <h1>TKX BATTLE 2D</h1>
  <div class="sub">VERSION 2.0 • ARCADE ARENA</div>

  <p style="font-size:14px">अपना खिलाड़ी और गेम स्तर चुनें</p>

  <label>🎯 कठिनाई स्तर</label>
  <select id="difficulty">
   <option value="easy">आसान (EASY)</option>
   <option value="medium">मध्यम (MEDIUM)</option>
   <option value="hard">कठिन (HARD)</option>
  </select>

  <label>👤 खिलाड़ी का रंग</label>
  <select id="skin">
   <option value="#42baff">नीला खिलाड़ी</option>
   <option value="#43e28a">हरा खिलाड़ी</option>
   <option value="#d58bff">बैंगनी खिलाड़ी</option>
  </select>

  <label>🔫 शुरुआती हथियार</label>
  <select id="weaponSelect">
   <option value="pulse">PULSE</option>
   <option value="rapid">RAPID</option>
   <option value="heavy">HEAVY</option>
  </select>

  <button id="start">GAME START ▶</button>

  <div id="help">
   🕹️ बाईं ओर के जॉयस्टिक से चलें।<br>
   🔥 FIRE से ऊर्जा गोलियाँ चलाएँ।<br>
   🔫 दाईं ओर से हथियार बदलें।<br>
   🏆 25 अंक बनाकर जीतें।
  </div>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const $=id=>document.getElementById(id);

let W=innerWidth,H=innerHeight,DPR=1;
const WORLD={w:1800,h:1300};

let player,enemies=[],bullets=[],obstacles=[];
let score=0,running=false,lastTime=0;
let spawnTimer=0,shootTimer=0,damageTimer=0;
let joyX=0,joyY=0,firing=false;
let selectedWeapon="pulse";
let difficulty="easy";
let camera={x:0,y:0};
let keys={};

const weaponData={
 pulse:{cool:.38,speed:550,damage:1,r:5,color:"#4ddcff"},
 rapid:{cool:.16,speed:620,damage:1,r:4,color:"#ffe65a"},
 heavy:{cool:.65,speed:420,damage:2,r:9,color:"#d58bff"}
};

const settings={
 easy:{enemySpeed:48,enemyDamage:8,spawn:1.7,max:7,label:"EASY"},
 medium:{enemySpeed:68,enemyDamage:12,spawn:1.25,max:10,label:"MEDIUM"},
 hard:{enemySpeed:92,enemyDamage:17,spawn:.85,max:13,label:"HARD"}
};

function resize(){
 W=innerWidth;H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

// नक्शे की इमारतें और पेड़
function makeMap(){
 obstacles=[];
 const houses=[
  [240,210,145,105],[590,180,120,110],
  [1060,240,155,110],[1430,190,130,120],
  [370,790,150,110],[890,920,160,105],
  [1320,780,145,115]
 ];
 for(const h of houses){
  obstacles.push({x:h[0],y:h[1],w:h[2],h:h[3],type:"house"});
 }
 const trees=[
  [100,150],[480,140],[800,140],[1280,120],[1660,180],
  [130,470],[500,480],[800,580],[1500,500],
  [150,950],[650,1100],[1100,1120],[1640,1000],
  [700,350],[1200,560],[980,720],[250,600]
 ];
 for(const t of trees){
  obstacles.push({x:t[0],y:t[1],w:35,h:35,type:"tree"});
 }
}

function newGame(){
 difficulty=$("difficulty").value;
 const config=settings[difficulty];
 selectedWeapon=$("weaponSelect").value;
 score=0;
 enemies=[];
 bullets=[];
 player={
  x:WORLD.w/2,y:WORLD.h/2,
  r:17,hp:100,speed:230,
  color:$("skin").value
 };
 makeMap();
 spawnTimer=1;
 shootTimer=0;
 damageTimer=0;
 lastTime=0;
 joyX=joyY=0;
 firing=false;
 camera.x=0;
 camera.y=0;
 $("level").textContent=config.label;
 document.querySelectorAll(".weapon").forEach(b=>{
  b.classList.toggle("active",b.dataset.weapon===selectedWeapon);
 });
 $("menu").style.display="none";
 $("notice").textContent="GAME START!";
 running=true;
 updateHUD();
 requestAnimationFrame(loop);
}

function updateHUD(){
 $("score").textContent=score;
 $("count").textContent=enemies.length;
 $("hp").style.width=Math.max(0,player.hp)+"%";
 $("hp").style.background=player.hp<30?"#ff4242":"#48e58b";
}

function circleRect(cx,cy,r,o){
 const x=Math.max(o.x,Math.min(cx,o.x+o.w));
 const y=Math.max(o.y,Math.min(cy,o.y+o.h));
 return Math.hypot(cx-x,cy-y)<r;
}

function blocked(x,y,r){
 if(x<r||y<r||x>WORLD.w-r||y>WORLD.h-r)return true;
 return obstacles.some(o=>circleRect(x,y,r,o));
}

function movePlayer(dx,dy){
 let nx=player.x+dx;
 if(!blocked(nx,player.y,player.r))player.x=nx;
 let ny=player.y+dy;
 if(!blocked(player.x,ny,player.r))player.y=ny;
}

function spawnEnemy(){
 const side=Math.floor(Math.random()*4);
 let x,y;
 if(side===0){x=Math.random()*WORLD.w;y=15}
 if(side===1){x=WORLD.w-15;y=Math.random()*WORLD.h}
 if(side===2){x=Math.random()*WORLD.w;y=WORLD.h-15}
 if(side===3){x=15;y=Math.random()*WORLD.h}

 if(Math.hypot(x-player.x,y-player.y)<330){
  x=(x+WORLD.w/2)%WORLD.w;
  y=(y+WORLD.h/2)%WORLD.h;
 }
 enemies.push({
  x,y,r:16,hp:difficulty==="hard"?3:2,
  speed:settings[difficulty].enemySpeed+
   Math.random()*16
 });
}

function fire(){
 if(!enemies.length)return;
 let target=null,best=Infinity;
 for(const e of enemies){
  let d=Math.hypot(e.x-player.x,e.y-player.y);
  if(d<best){best=d;target=e}
 }
 if(!target)return;

 const w=weaponData[selectedWeapon];
 const dx=target.x-player.x;
 const dy=target.y-player.y;
 const d=Math.hypot(dx,dy)||1;

 bullets.push({
  x:player.x,y:player.y,
  vx:dx/d*w.speed,vy:dy/d*w.speed,
  life:1.6,damage:w.damage,
  r:w.r,color:w.color
 });
}

function update(dt){
 const config=settings[difficulty];

 let mx=joyX,my=joyY;
 if(keys.ArrowLeft||keys.a)mx--;
 if(keys.ArrowRight||keys.d)mx++;
 if(keys.ArrowUp||keys.w)my--;
 if(keys.ArrowDown||keys.s)my++;

 let length=Math.hypot(mx,my);
 if(length>1){mx/=length;my/=length}

 movePlayer(mx*player.speed*dt,my*player.speed*dt);

 camera.x=Math.max(0,Math.min(WORLD.w-W,player.x-W/2));
 camera.y=Math.max(0,Math.min(WORLD.h-H,player.y-H/2));

 spawnTimer-=dt;
 if(spawnTimer<=0&&enemies.length<config.max){
  spawnEnemy();
  spawnTimer=config.spawn;
 }

 shootTimer-=dt;
 if(firing&&shootTimer<=0){
  fire();
  shootTimer=weaponData[selectedWeapon].cool;
 }

 damageTimer-=dt;

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  const dx=player.x-e.x,dy=player.y-e.y;
  const d=Math.hypot(dx,dy)||1;
  const vx=dx/d*e.speed*dt;
  const vy=dy/d*e.speed*dt;

  let nx=e.x+vx,ny=e.y+vy;
  if(!blocked(nx,e.y,e.r))e.x=nx;
  if(!blocked(e.x,ny,e.r))e.y=ny;

  if(d<player.r+e.r&&damageTimer<=0){
   player.hp-=config.enemyDamage;
   damageTimer=.7;
  }
 }

 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];
  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.life-=dt;

  let remove=false;

  for(let j=enemies.length-1;j>=0;j--){
   const e=enemies[j];
   if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
    e.hp-=b.damage;
    remove=true;
    if(e.hp<=0){
     enemies.splice(j,1);
     score++;
    }
    break;
   }
  }

  if(remove||b.life<=0||blocked(b.x,b.y,b.r)){
   bullets.splice(i,1);
  }
 }

 updateHUD();

 if(score>=25)endGame(true);
 else if(player.hp<=0)endGame(false);
}

function drawMap(){
 ctx.fillStyle="#345c42";
 ctx.fillRect(0,0,WORLD.w,WORLD.h);

 // रास्ते
 ctx.fillStyle="#8b9876";
 ctx.fillRect(0,630,WORLD.w,75);
 ctx.fillRect(830,0,75,WORLD.h);

 // घास की छोटी सजावट
 ctx.fillStyle="#ffffff12";
 for(let x=0;x<WORLD.w;x+=80){
  for(let y=0;y<WORLD.h;y+=80){
   ctx.fillRect(x+10,y+15,3,3);
   ctx.fillRect(x+42,y+49,3,3);
  }
 }

 for(const o of obstacles){
  if(o.type==="house"){
   ctx.fillStyle="#b8a47c";
   ctx.fillRect(o.x,o.y,o.w,o.h);
   ctx.fillStyle="#79563d";
   ctx.fillRect(o.x-5,o.y-8,o.w+10,18);
   ctx.fillStyle="#456f78";
   ctx.fillRect(o.x+20,o.y+28,28,27);
   ctx.fillRect(o.x+o.w-48,o.y+28,28,27);
   ctx.fillStyle="#604a36";
   ctx.fillRect(o.x+o.w/2-13,o.y+o.h-38,26,38);
   ctx.strokeStyle="#e8d7ac";
   ctx.strokeRect(o.x,o.y,o.w,o.h);
  }else{
   ctx.fillStyle="#60452f";
   ctx.fillRect(o.x+14,o.y+16,9,24);
   ctx.fillStyle="#276e42";
   ctx.beginPath();
   ctx.arc(o.x+17,o.y+14,23,0,Math.PI*2);
   ctx.fill();
   ctx.fillStyle="#438c50";
   ctx.beginPath();
   ctx.arc(o.x+10,o.y+8,12,0,Math.PI*2);
   ctx.fill();
  }
 }
}

function draw(){
 ctx.save();
 ctx.translate(-camera.x,-camera.y);
 drawMap();

 // दुश्मन
 for(const e of enemies){
  ctx.fillStyle="#d94350";
  ctx.beginPath();
  ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#ffc2c5";
  ctx.lineWidth=3;
  ctx.stroke();
  ctx.fillStyle="white";
  ctx.fillRect(e.x-7,e.y-4,4,4);
  ctx.fillRect(e.x+3,e.y-4,4,4);
  ctx.fillStyle="#252525";
  ctx.fillRect(e.x-12,e.y-24,24,4);
  ctx.fillStyle="#65e68b";
  ctx.fillRect(e.x-12,e.y-24,24*Math.max(0,e.hp/3),4);
 }

 // गोलियाँ
 for(const b of bullets){
  ctx.fillStyle=b.color;
  ctx.shadowColor=b.color;
  ctx.shadowBlur=14;
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;
 }

 // खिलाड़ी
 ctx.fillStyle=player.color;
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fill();
 ctx.strokeStyle="white";
 ctx.lineWidth=3;
 ctx.stroke();

 ctx.fillStyle="white";
 ctx.beginPath();
 ctx.arc(player.x+5,player.y-5,4,0,Math.PI*2);
 ctx.fill();

 // नक्शे की सीमा
 ctx.strokeStyle="#b6e3aa";
 ctx.lineWidth=8;
 ctx.strokeRect(0,0,WORLD.w,WORLD.h);

 ctx.restore();
}

function endGame(win){
 running=false;
 firing=false;
 $("menu").style.display="flex";
 $("card").innerHTML=`
  <h1>${win?"🏆 YOU WIN!":"GAME OVER"}</h1>
  <p style="margin:15px 0;line-height:1.8">
   TKX BATTLE 2D<br>
   आपका स्कोर: ${score}<br>
   ${win?"शानदार खेल! आपने जीत हासिल की।":"फिर से कोशिश करें!"}
  </p>
  <button id="start">PLAY AGAIN ▶</button>
  <p style="margin-top:15px;font-size:12px;color:#b5d9c5">
   कठिनाई: ${settings[difficulty].label}
  </p>`;
 $("start").onclick=newGame;
}

function loop(time){
 if(!running)return;
 let dt=lastTime?Math.min((time-lastTime)/1000,.04):0;
 lastTime=time;
 update(dt);
 draw();
 if(running)requestAnimationFrame(loop);
}

// जॉयस्टिक
const joy=$("joystick"),knob=$("knob");
let joyId=null;

function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=34;
 const d=Math.hypot(dx,dy);
 if(d>max){dx=dx/d*max;dy=dy/d*max}
 joyX=dx/max;
 joyY=dy/max;
 knob.style.transform=`translate(${dx}px,${dy}px)`;
}

joy.addEventListener("pointerdown",e=>{
 joyId=e.pointerId;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});
joy.addEventListener("pointermove",e=>{
 if(e.pointerId===joyId)moveJoy(e);
});
function stopJoy(e){
 if(e.pointerId!==joyId)return;
 joyId=null;joyX=joyY=0;
 knob.style.transform="translate(0,0)";
}
joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);

// फायर बटन
const fireButton=$("fire");
fireButton.addEventListener("pointerdown",e=>{
 e.preventDefault();
 firing=true;
 fireButton.setPointerCapture(e.pointerId);
});
fireButton.addEventListener("pointerup",()=>firing=false);
fireButton.addEventListener("pointercancel",()=>firing=false);
fireButton.addEventListener("lostpointercapture",()=>firing=false);

// हथियार बदलना
document.querySelectorAll(".weapon").forEach(b=>{
 b.addEventListener("click",()=>{
  selectedWeapon=b.dataset.weapon;
  document.querySelectorAll(".weapon").forEach(x=>
   x.classList.toggle("active",x===b)
  );
 });
});

// कंप्यूटर कीबोर्ड
addEventListener("keydown",e=>{
 keys[e.key]=true;
});
addEventListener("keyup",e=>{
 keys[e.key]=false;
});

$("start").onclick=newGame;

player={x:WORLD.w/2,y:WORLD.h/2,r:17,hp:100,
 color:"#42baff"};
makeMap();
draw();
</script>
</body>
  </html>
