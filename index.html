
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TKX BATTLE 2D</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  touch-action: none;
}

body {
  background: #101b24;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#game {
  width: 100vw;
  height: 100dvh;
  display: block;
  background: #243b35;
}

#top {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
  z-index: 2;
  pointer-events: none;
}

.panel {
  background: #10251ee8;
  border: 1px solid #70d5a0;
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
}

#healthBar {
  width: 110px;
  height: 9px;
  background: #555;
  border-radius: 10px;
  margin-top: 5px;
  overflow: hidden;
}

#health {
  height: 100%;
  width: 100%;
  background: #38e879;
}

#joystick {
  position: fixed;
  bottom: 28px;
  left: 25px;
  width: 115px;
  height: 115px;
  border-radius: 50%;
  background: #ffffff22;
  border: 2px solid #ffffff80;
  z-index: 3;
}

#knob {
  position: absolute;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #6be9ad;
  border: 3px solid white;
  left: 31px;
  top: 31px;
}

#fire {
  position: fixed;
  bottom: 43px;
  right: 28px;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: #e64d4d;
  color: white;
  border: 3px solid white;
  font-size: 16px;
  font-weight: bold;
  z-index: 3;
}

#fire:active {
  background: #ff8585;
  transform: scale(.94);
}

#message {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #07120ddd;
  z-index: 5;
  text-align: center;
  padding: 20px;
}

#card {
  background: #17372b;
  border: 2px solid #6be9ad;
  padding: 28px 20px;
  border-radius: 18px;
  width: min(330px, 95vw);
}

#card h1 {
  color: #6be9ad;
  font-size: 28px;
  margin-bottom: 12px;
}

#card p {
  line-height: 1.6;
  margin-bottom: 18px;
}

#start {
  padding: 13px 25px;
  background: #6be9ad;
  color: #10251e;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="top">
  <div class="panel">
    ❤️ स्वास्थ्य
    <div id="healthBar"><div id="health"></div></div>
  </div>
  <div class="panel">⭐ अंक: <span id="score">0</span></div>
  <div class="panel">👾 दुश्मन: <span id="enemies">0</span></div>
</div>

<canvas id="game"></canvas>

<div id="joystick">
  <div id="knob"></div>
</div>

<button id="fire">FIRE 🔥</button>

<div id="message">
  <div id="card">
    <h1>TKX BATTLE 2D</h1>
    <p>
      आपका अपना बैटल गेम!<br>
      जॉयस्टिक से चलें।<br>
      FIRE दबाकर ऊर्जा वाली गोलियाँ चलाएँ।<br>
      20 अंक बनाकर जीतें!
    </p>
    <button id="start">GAME START</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreText = document.getElementById("score");
const enemyText = document.getElementById("enemies");
const healthBar = document.getElementById("health");
const message = document.getElementById("message");
const card = document.getElementById("card");

let W, H, player, enemies, bullets;
let score = 0;
let running = false;
let lastTime = 0;
let spawnTimer = 0;
let shootTimer = 0;
let damageTimer = 0;
let joyX = 0, joyY = 0;
let firing = false;
let keys = {};

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function newGame() {
  score = 0;
  enemies = [];
  bullets = [];
  player = {
    x: W / 2,
    y: H / 2,
    r: 16,
    hp: 100,
    speed: 210
  };

  spawnTimer = 0;
  shootTimer = 0;
  damageTimer = 0;
  lastTime = 0;
  joyX = 0;
  joyY = 0;
  firing = false;
  running = true;
  message.style.display = "none";
  updateUI();
  requestAnimationFrame(loop);
}

function updateUI() {
  scoreText.textContent = score;
  enemyText.textContent = enemies.length;
  healthBar.style.width = Math.max(0, player.hp) + "%";
  healthBar.style.background =
    player.hp < 30 ? "#ff4545" : "#38e879";
}

function spawnEnemy() {
  let side = Math.floor(Math.random() * 4);
  let x, y;

  if (side === 0) { x = Math.random()*W; y = -25; }
  if (side === 1) { x = W+25; y = Math.random()*H; }
  if (side === 2) { x = Math.random()*W; y = H+25; }
  if (side === 3) { x = -25; y = Math.random()*H; }

  enemies.push({
    x, y,
    r: 15,
    speed: 48 + Math.random()*25,
    hp: 1
  });
}

function shoot() {
  if (!enemies.length) return;

  let target = null;
  let best = Infinity;

  for (const e of enemies) {
    let d = Math.hypot(e.x-player.x, e.y-player.y);
    if (d < best) {
      best = d;
      target = e;
    }
  }

  if (!target) return;

  let dx = target.x-player.x;
  let dy = target.y-player.y;
  let d = Math.hypot(dx,dy) || 1;

  bullets.push({
    x: player.x,
    y: player.y,
    vx: dx/d*460,
    vy: dy/d*460,
    life: 1.3
  });
}

function endGame(win) {
  running = false;
  firing = false;
  card.innerHTML = `
    <h1>${win ? "🏆 YOU WIN!" : "GAME OVER"}</h1>
    <p>आपका स्कोर: ${score}<br>
    TKX BATTLE 2D खेलने के लिए धन्यवाद!</p>
    <button id="start">PLAY AGAIN</button>
  `;
  message.style.display = "flex";
  document.getElementById("start").onclick = newGame;
}

function update(dt) {
  let mx = joyX;
  let my = joyY;

  if (keys.ArrowLeft || keys.a) mx -= 1;
  if (keys.ArrowRight || keys.d) mx += 1;
  if (keys.ArrowUp || keys.w) my -= 1;
  if (keys.ArrowDown || keys.s) my += 1;

  let len = Math.hypot(mx,my);
  if (len > 1) {
    mx /= len;
    my /= len;
  }

  player.x += mx * player.speed * dt;
  player.y += my * player.speed * dt;

  player.x = Math.max(player.r, Math.min(W-player.r,player.x));
  player.y = Math.max(player.r, Math.min(H-player.r,player.y));

  spawnTimer -= dt;
  if (spawnTimer <= 0 && enemies.length < 10) {
    spawnEnemy();
    spawnTimer = 1.3;
  }

  shootTimer -= dt;
  if (firing && shootTimer <= 0) {
    shoot();
    shootTimer = 0.28;
  }

  damageTimer -= dt;

  for (let i = enemies.length-1; i >= 0; i--) {
    const e = enemies[i];
    let dx = player.x-e.x;
    let dy = player.y-e.y;
    let d = Math.hypot(dx,dy) || 1;

    e.x += dx/d*e.speed*dt;
    e.y += dy/d*e.speed*dt;

    if (d < player.r+e.r && damageTimer <= 0) {
      player.hp -= 12;
      damageTimer = 0.65;
    }
  }

  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx*dt;
    b.y += b.vy*dt;
    b.life -= dt;

    let hit = false;

    for (let j = enemies.length-1; j >= 0; j--) {
      const e = enemies[j];
      if (Math.hypot(b.x-e.x,b.y-e.y) < e.r+6) {
        enemies.splice(j,1);
        score++;
        hit = true;
        break;
      }
    }

    if (hit || b.life <= 0 ||
        b.x < 0 || b.x > W || b.y < 0 || b.y > H) {
      bullets.splice(i,1);
    }
  }

  updateUI();

  if (score >= 20) endGame(true);
  if (player.hp <= 0) endGame(false);
}

function draw() {
  ctx.fillStyle = "#29483c";
  ctx.fillRect(0,0,W,H);

  // मैदान की जाली
  ctx.strokeStyle = "#ffffff0b";
  ctx.lineWidth = 1;
  for (let x=0; x<W; x+=40) {
    ctx.beginPath(); ctx.moveTo(x,0);
    ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y=0; y<H; y+=40) {
    ctx.beginPath(); ctx.moveTo(0,y);
    ctx.lineTo(W,y); ctx.stroke();
  }

  // पेड़ और मैदान की सजावट
  for (let x=30; x<W; x+=100) {
    for (let y=110; y<H-130; y+=120) {
      ctx.fillStyle="#416c4c";
      ctx.beginPath();
      ctx.arc(x,y,12,0,Math.PI*2);
      ctx.fill();
    }
  }

  // खिलाड़ी
  ctx.fillStyle = "#48baff";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="white";
  ctx.lineWidth=3;
  ctx.stroke();

  // खिलाड़ी की दिशा का छोटा निशान
  ctx.fillStyle="white";
  ctx.beginPath();
  ctx.arc(player.x+5,player.y-4,4,0,Math.PI*2);
  ctx.fill();

  // दुश्मन
  for (const e of enemies) {
    ctx.fillStyle="#ed5555";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.r,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle="#ffc0c0";
    ctx.lineWidth=2;
    ctx.stroke();
    ctx.fillStyle="white";
    ctx.fillRect(e.x-5,e.y-3,3,3);
    ctx.fillRect(e.x+3,e.y-3,3,3);
  }

  // ऊर्जा वाली गोलियाँ
  for (const b of bullets) {
    ctx.fillStyle="#ffe85b";
    ctx.shadowColor="#ffe85b";
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(b.x,b.y,5,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }
}

function loop(time) {
  if (!running) return;
  let dt = lastTime ? Math.min((time-lastTime)/1000,0.035) : 0;
  lastTime = time;
  update(dt);
  draw();
  if (running) requestAnimationFrame(loop);
}

// मोबाइल जॉयस्टिक
const joystick = document.getElementById("joystick");
const knob = document.getElementById("knob");
let joyPointer = null;

function moveJoy(e) {
  const rect = joystick.getBoundingClientRect();
  let dx = e.clientX-(rect.left+rect.width/2);
  let dy = e.clientY-(rect.top+rect.height/2);
  const distance = Math.hypot(dx,dy);
  const max = 34;

  if (distance > max) {
    dx = dx/distance*max;
    dy = dy/distance*max;
  }

  joyX = dx/max;
  joyY = dy/max;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
}

joystick.addEventListener("pointerdown",e=>{
  joyPointer = e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  moveJoy(e);
});

joystick.addEventListener("pointermove",e=>{
  if (e.pointerId === joyPointer) moveJoy(e);
});

function stopJoy(e) {
  if (e.pointerId !== joyPointer) return;
  joyPointer = null;
  joyX = 0;
  joyY = 0;
  knob.style.transform = "translate(0px,0px)";
}

joystick.addEventListener("pointerup",stopJoy);
joystick.addEventListener("pointercancel",stopJoy);

// गोली चलाने का बटन
const fireButton = document.getElementById("fire");

fireButton.addEventListener("pointerdown",e=>{
  e.preventDefault();
  firing = true;
  fireButton.setPointerCapture(e.pointerId);
});

fireButton.addEventListener("pointerup",()=>firing=false);
fireButton.addEventListener("pointercancel",()=>firing=false);
fireButton.addEventListener("lostpointercapture",()=>firing=false);

// कंप्यूटर कीबोर्ड
window.addEventListener("keydown",e=>{
  keys[e.key] = true;
});
window.addEventListener("keyup",e=>{
  keys[e.key] = false;
});

document.getElementById("start").onclick = newGame;

draw();
</script>
</body>
  </html>
